# =====================================================================
# AIRWOLF HARDENED SQUID PROXY CONFIGURATION
# Framework: Cloak, Strip, and Tunnel.
# By-Hansolo5589
# =====================================================================
http_port 127.0.0.1:3128
dns_nameservers 9.9.9.9
acl SSL_ports port 443
acl Safe_ports port 80 443 1025-65535
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
http_access deny all
via off
forwarded_for delete
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
request_header_access Proxy-Connection deny all
request_header_access Sec-CH-UA deny all
request_header_access Sec-CH-UA-Mobile deny all
request_header_access Sec-CH-UA-Platform deny all
request_header_access User-Agent deny all
request_header_replace User-Agent Mozilla/5.0 (Android 10; Mobile; rv:115.0) Gecko/115.0 Firefox/115.0
visible_hostname none
httpd_suppress_version_string on
access_log none
